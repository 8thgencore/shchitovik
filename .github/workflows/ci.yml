# Checks on every push and PR; on main also builds the web image and the APK.
# Flutter comes from .fvmrc: public Flutter images lag behind the pinned version.
name: CI

on:
  push:
  pull_request:

jobs:
  data:
    name: Catalogs and formula oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -I tools/catalog/validate_catalogs.py
      - run: python3 -I verification/oracle/run_vectors.py

  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - run: bash scripts/bootstrap.bash
      - run: bash scripts/format.bash --check
      - run: bash scripts/analyze.bash
      - run: bash scripts/test.bash
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 7

  web-image:
    name: Web image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [data, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            FLUTTER_VERSION=${{ steps.fvm.outputs.flutter }}
            APP_BASE_URL=${{ vars.APP_BASE_URL }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    name: APK
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [data, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - run: bash scripts/bootstrap.bash
      - run: >-
          cd app && flutter build apk --release
          --dart-define=ENVIRONMENT=prod --dart-define=CATALOG_URL=${{ vars.APP_BASE_URL }}
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/
          retention-days: 7
