# Manual release tasks (Actions → Release → Run workflow).
# Sentry stays off: no SENTRY_DSN define, the privacy policy promises no error reports.
name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to do
        type: choice
        options: [deploy-web, store-android]

jobs:
  # Web app and price catalog: one Docker image (deploy/docker), run by compose on the VPS
  # behind the host's Caddy. The image is small, so it travels over SSH without a registry.
  deploy-web:
    name: Deploy Web to VPS
    if: inputs.target == 'deploy-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            FLUTTER_VERSION=${{ steps.fvm.outputs.flutter }}
            APP_BASE_URL=${{ vars.APP_BASE_URL }}
          tags: shchitovik-web:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload image and restart
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: |
          docker save shchitovik-web:latest | gzip | ssh "$TARGET" 'gunzip | docker load'
          ssh "$TARGET" 'mkdir -p ~/shchitovik'
          scp deploy/compose/prod.yaml "$TARGET:shchitovik/prod.yaml"
          ssh "$TARGET" 'docker compose -f ~/shchitovik/prod.yaml up -d --no-build --pull never --wait && docker image prune -f'

  store-android:
    name: Signed AAB and APK
    if: inputs.target == 'store-android'
    runs-on: ubuntu-latest
    env:
      DEFINES: --dart-define=ENVIRONMENT=prod --dart-define=CATALOG_URL=${{ vars.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - run: bash scripts/bootstrap.bash
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: cd app && flutter build appbundle --release --build-number=${{ github.run_number }} $DEFINES
      - run: cd app && flutter build apk --release --build-number=${{ github.run_number }} $DEFINES
      - run: rm -f app/android/key.properties "$RUNNER_TEMP/upload.jks"
        if: always()
      - uses: actions/upload-artifact@v7
        with:
          name: store-android
          path: |
            app/build/app/outputs/bundle/release/
            app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
