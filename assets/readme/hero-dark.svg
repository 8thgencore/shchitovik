    <text x="-4" y="176" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="600" letter-spacing="-1.5" fill="#F5F5F5">Щитовик</text>
    <text x="0" y="226" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#F5F5F5">Помещения и приборы →</text>
    <text x="0" y="258" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#F5F5F5">линии, автоматы, УЗО, кабель,</text>
    <text x="0" y="290" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#F5F5F5">щит на DIN-рейках, смета и PDF</text>
    <text x="0" y="352" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1" fill="#A3A3A3">ANDROID · iOS · WEB · ОФЛАЙН</text>
  </g>

