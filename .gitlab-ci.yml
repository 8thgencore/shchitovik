# CI for gitlab.com with a self-hosted runner (Docker executor, tag `shchitovik`).
# iOS is built manually on a Mac; publishing to stores is not automated.
# Sentry is off for releases: no SENTRY_DSN define, the privacy policy promises no error reports.

image: ghcr.io/cirruslabs/flutter:3.47.6

default:
  tags: [shchitovik]
  before_script:
    - bash scripts/bootstrap.bash
  cache:
    key: pub-$CI_COMMIT_REF_SLUG
    paths: [.pub-cache/]

variables:
  PUB_CACHE: $CI_PROJECT_DIR/.pub-cache

stages: [check, test, build, deploy]

format:
  stage: check
  script:
    - bash scripts/format.bash --check

validate_catalogs:
  stage: check
  image: python:3.13-slim
  before_script: []
  cache: []
  script:
    - python3 -I tools/catalog/validate_catalogs.py

verify_oracle:
  stage: check
  image: python:3.13-slim
  before_script: []
  cache: []
  script:
    - python3 -I verification/oracle/run_vectors.py

analyze:
  stage: check
  script:
    - bash scripts/analyze.bash

test:
  stage: test
  script:
    - bash scripts/test.bash
  artifacts:
    when: always
    paths: [reports/]
    expire_in: 1 week

build_web:
  stage: build
  script:
    - cd app && flutter build web --release --no-web-resources-cdn --dart-define=ENVIRONMENT=prod --dart-define=CATALOG_URL="$APP_BASE_URL"
  artifacts:
    paths: [app/build/web/]
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build_apk:
  stage: build
  script:
    - cd app && flutter build apk --release --dart-define=ENVIRONMENT=prod --dart-define=CATALOG_URL="$APP_BASE_URL"
  artifacts:
    paths: [app/build/app/outputs/flutter-apk/]
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Signed AAB (Google Play, RuStore) and APK (RuStore) with the upload key; see docs/RELEASE.md.
build_store_android:
  stage: build
  script:
    - |
      cat > app/android/key.properties <<EOF
      storeFile=$ANDROID_KEYSTORE
      storePassword=$ANDROID_KEYSTORE_PASSWORD
      keyAlias=$ANDROID_KEY_ALIAS
      keyPassword=$ANDROID_KEY_PASSWORD
      EOF
    - cd app
    - flutter build appbundle --release --build-number="$CI_PIPELINE_IID" --dart-define=ENVIRONMENT=prod --dart-define=CATALOG_URL="$APP_BASE_URL"
    - flutter build apk --release --build-number="$CI_PIPELINE_IID" --dart-define=ENVIRONMENT=prod --dart-define=CATALOG_URL="$APP_BASE_URL"
    - rm android/key.properties
  artifacts:
    paths:
      - app/build/app/outputs/bundle/release/
      - app/build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

.deploy:
  stage: deploy
  image: alpine:3.22
  before_script:
    - apk add --no-cache openssh-client rsync python3
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy_web:
  extends: .deploy
  needs: [build_web]
  script:
    - rsync -az --delete app/build/web/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/shchitovik/web/"

deploy_catalog:
  extends: .deploy
  needs: []
  script:
    - python3 -I tools/catalog/validate_catalogs.py
    - python3 -I tools/catalog/publish_catalog.py out
    - rsync -az --delete out/catalog/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/shchitovik/catalog/"
