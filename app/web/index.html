<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Щитовик — расчёт электрощита и смета">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Щитовик">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Щитовик</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading indicator until the first frame; colours follow UiColors.canvas and accent. -->
  <style>
    html, body { margin: 0; height: 100%; background: #F4F4F4; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    }
    #loading div {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid #E5E5E5; border-top-color: #D9480F;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0A0A0A; }
      #loading div { border-color: #262626; border-top-color: #FF7B36; }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading div { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <div id="loading" role="progressbar" aria-label="Загрузка"><div></div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
