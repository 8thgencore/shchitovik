# Launcher icons and favicons of «Щитовик», generated by launcher_icons.
# Sources: app/assets/icon (rendered by tools/app_icon/render_icons.py).
# Run: see tools/app_icon/README.md.
launcher_icons:
  image_path: "assets/icon/icon.png"
  android:
    generate: true
    adaptive_icon_background: "#D9480F"
    adaptive_icon_foreground: "assets/icon/foreground.png"
    adaptive_icon_foreground_inset: 0
    adaptive_icon_monochrome: "assets/icon/monochrome.png"
    adaptive_icon_monochrome_inset: 0
  ios:
    generate: true
    remove_alpha: true
    background_color: "#D9480F"
    # iOS 18+ appearances of the PNG catalog.
    image_path_dark_transparent: "assets/icon/dark.png"
    image_path_tinted_grayscale: "assets/icon/tinted.png"
    # iOS 26 Liquid Glass: the white mark as one glass layer over the accent canvas; white in
    # every appearance, the dark PNG (accent mark) would vanish on the accent fill.
    liquid_glass_layers:
      - image_path: "assets/icon/mark.svg"
        image_path_dark: "assets/icon/mark.svg"
        image_path_tinted: "assets/icon/mark.svg"
  web:
    generate: true
    image_path: "assets/icon/favicon.png"
    image_path_favicon_svg: "assets/icon/favicon.svg"
    image_path_pwa: "assets/icon/icon-rounded.png"
    image_path_maskable: "assets/icon/icon.png"
    image_path_monochrome: "assets/icon/monochrome.png"
    background_color: "#F4F4F4"
    theme_color_light: "#FFFFFF"
    theme_color_dark: "#141414"
