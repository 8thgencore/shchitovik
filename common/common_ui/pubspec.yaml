name: common_ui
description: "Design system «Чертёж» of Щитовик: tokens, theme and widgets."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    # Lucide icons, the 300 weight only (ISC, see assets/fonts/Lucide-LICENSE.txt); see UiIcons.
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide-300.ttf
    # IBM Plex Sans and Mono (SIL OFL 1.1, see assets/fonts/*-OFL.txt): interface and values.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
