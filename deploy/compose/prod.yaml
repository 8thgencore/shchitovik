name: shchitovik-web-prod

services:
  web:
    container_name: shchitovik-prod-web
    image: ${SHCHITOVIK_WEB_IMAGE:-shchitovik-web:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        APP_BASE_URL: ${APP_BASE_URL:-https://shchitovik.ru}
    restart: unless-stopped
    # Loopback only: the server's edge proxy owns 80/443 and terminates TLS.
    ports:
      - "127.0.0.1:${WEB_HTTP_HOST_PORT:-8082}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
