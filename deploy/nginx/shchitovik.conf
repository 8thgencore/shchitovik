# nginx site for «Щитовик»: Flutter Web build and the price catalog.
# Domain shchitovik.ru; TLS certificates via certbot (Let's Encrypt).
# Layout on the server (deployed by Actions → Release → deploy-files, see deploy/README.md):
#   /var/www/shchitovik/web/      — Flutter Web build (app/build/web)
#   /var/www/shchitovik/catalog/  — catalog files (tools/catalog/publish_catalog.py)

server {
    listen 80;
    listen [::]:80;
    server_name shchitovik.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shchitovik.ru;

    ssl_certificate     /etc/letsencrypt/live/shchitovik.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shchitovik.ru/privkey.pem;

    root /var/www/shchitovik/web;
    index index.html;

    # sqlite3.wasm must be served as WebAssembly.
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    # Cross-origin isolation enables OPFS storage for drift (SharedArrayBuffer);
    # without it the app falls back to IndexedDB.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/javascript application/json application/wasm text/css text/plain image/svg+xml;

    # Entry points must never be cached: they reference the current build.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache" always;
    }

    # Price catalog for the mobile apps and the web app.
    location /catalog/ {
        alias /var/www/shchitovik/catalog/;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Single-page app: unknown paths are routes of go_router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
